<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FF8C73">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="美紅はここ">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <title>今日の美紅はここにいるよ</title>
    <link rel="icon" href="./assets/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="preload" href="./assets/fonts/MochiyPopOne-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="stage" aria-label="現在地" aria-describedby="fullscreen-help" tabindex="0">
      <h1>#今日の美紅はここにいるよ</h1>
      <div class="coordinates" aria-label="緯度経度">
        <p id="latitude" aria-label="緯度">北緯 --°--′--.-″</p>
        <p id="longitude" aria-label="経度">東経 ---°--′--.-″</p>
      </div>
      <p id="municipality" class="municipality" role="status" aria-live="polite">現在地を取得しています</p>
      <span id="fullscreen-help" class="visually-hidden">画面をダブルクリック、またはFキーで全画面表示を切り替えます。位置情報が許可されていない場合はブラウザの設定で許可してください。</span>
    </main>
  </body>
</html>
